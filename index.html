<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>선부포토 - my-photobooth</title>
    <!-- QR 코드 생성 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f1117;
            --panel-bg: #1a1d26;
            --card-bg: #262a36;
            --accent-color: #ff4757;
            --accent-hover: #ff6b81;
            --text-color: #ffffff;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* 전체 반응형 메인 레이아웃 */
        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
            gap: 20px;
        }

        /* 왼쪽: 촬영 스테이지 */
        .stage-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 뷰파인더 가두는 프레임 */
        .viewfinder-outer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: calc(100vh - 120px);
            max-height: 600px;
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            padding: 16px 16px 24px 16px;
            transition: all 0.3s ease;
        }

        /* 테마 배경 레이아웃 */
        .viewfinder-outer.theme-color-1 { background: #1a1a1a; }
        .viewfinder-outer.theme-color-2 { background: #ffffff; color: #1a1a1a; }
        .viewfinder-outer.theme-color-3 { background: #f4ebe1; color: #333333; }
        .viewfinder-outer.theme-grad-1 { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .viewfinder-outer.theme-grad-2 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .viewfinder-outer.theme-grad-3 { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .viewfinder-outer.theme-pat-1 {
            background-color: #ffb6c1;
            background-image: repeating-linear-gradient(45deg, #111111 25%, transparent 25%, transparent 75%, #111111 75%, #111111), repeating-linear-gradient(45deg, #111111 25%, #ffb6c1 25%, #ffb6c1 75%, #111111 75%, #111111);
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
        }
        .viewfinder-outer.theme-pat-2 {
            background-color: #fefae0;
            background-image: radial-gradient(#dda15e 20%, transparent 20%);
            background-size: 24px 24px;
        }
        .viewfinder-outer.theme-pat-3 {
            background-color: #ffe5ec;
            background-image: repeating-linear-gradient(-45deg, #ffb3c1, #ffb3c1 10px, #ffe5ec 10px, #ffe5ec 20px);
        }

        /* 상단 타이틀 */
        .frame-header {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800;
            padding-bottom: 12px;
            letter-spacing: -0.5px;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* 컷수에 따라 변하는 카메라 그리드 패널 */
        .camera-grid {
            flex: 1;
            display: grid;
            gap: 8px;
            width: 100%;
            position: relative;
            z-index: 2;
            overflow: hidden;
            border-radius: 8px;
        }

        /* 컷수 별 그리드 정의 */
        .camera-grid.cut-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .camera-grid.cut-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .camera-grid.cut-3 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .camera-grid.cut-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .cut-box {
            position: relative;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 6px;
        }

        /* 실제 라이브 비디오 스트림 */
        .webcam-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* 좌우 반전 */
            display: block;
        }

        /* 하단 서명 라벨 */
        .frame-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            z-index: 5;
        }

        /* 스티커 배치 오버레이 레이어 */
        .sticker-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .sticker-item {
            position: absolute;
            font-size: 2rem;
            transform: translate(-50%, -50%);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* 카운트다운 숫자 */
        .countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0,0,0,0.8), 0 0 40px rgba(255,71,87,0.6);
            z-index: 30;
            display: none;
        }

        /* 하단 촬영 버튼 */
        .action-bar {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 36px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(255, 71, 87, 0.6);
        }

        /* 오른쪽: 사이드바 패널 */
        .sidebar-section {
            width: 360px;
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        /* 버튼 그리드 */
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }

        .btn-opt {
            background-color: var(--card-bg);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 10px 6px;
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-opt:hover {
            background-color: #323746;
        }

        .btn-opt.active {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        .input-text {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .input-text:focus {
            border-color: var(--accent-color);
        }

        /* 모달 팝업 */
        .modal-mask {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--panel-bg);
            border-radius: 24px;
            padding: 28px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 16px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-img-box {
            width: 100%;
            max-height: 220px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* 모바일 / 태블릿 반응형 레이아웃 */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                height: auto;
                overflow-y: auto;
                padding: 12px;
            }

            .sidebar-section {
                width: 100%;
                max-height: none;
            }

            .viewfinder-outer {
                height: 520px;
                max-height: 70vh;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 왼쪽: 실시간 라이브 뷰파인더 스테이지 -->
        <div class="stage-section">
            <div class="viewfinder-outer theme-color-1" id="frame-outer">
                <!-- 상단 문구 -->
                <div class="frame-header" id="text-header-display">오늘의 추억 ✨</div>

                <!-- 컷수 그리드 레이아웃 -->
                <div class="camera-grid cut-4" id="camera-grid">
                    <!-- 스크립트로 컷수에 맞춰 동적 생성 -->
                </div>

                <!-- 하단 라벨 -->
                <div class="frame-footer">
                    <span>Seonbu</span>
                    <span>선부포토 📸</span>
                </div>

                <!-- 스티커 오버레이 레이어 -->
                <div class="sticker-layer" id="sticker-layer"></div>

                <!-- 카운트다운 -->
                <div class="countdown-overlay" id="countdown">3</div>
            </div>

            <!-- 촬영 버튼 -->
            <div class="action-bar">
                <button class="btn-primary" id="btn-take-photo">사진 촬영 📸</button>
            </div>
        </div>

        <!-- 오른쪽: 옵션 컨트롤 사이드바 -->
        <div class="sidebar-section">
            <div class="sidebar-title">📸 선부포토 설정</div>

            <!-- 1. 컷수 선택 -->
            <div class="control-group">
                <div class="control-label">1. 프레임 컷수 선택</div>
                <div class="grid-4">
                    <button class="btn-opt" onclick="setCutLayout(1, this)">1컷</button>
                    <button class="btn-opt" onclick="setCutLayout(2, this)">2컷</button>
                    <button class="btn-opt" onclick="setCutLayout(3, this)">3컷</button>
                    <button class="btn-opt active" onclick="setCutLayout(4, this)">4컷</button>
                </div>
            </div>

            <!-- 2. 배경 테마 선택 -->
            <div class="control-group">
                <div class="control-label">2. 배경 테마 선택</div>
                <div class="grid-3">
                    <button class="btn-opt active" onclick="setTheme('theme-color-1', this)">🖤 블랙</button>
                    <button class="btn-opt" onclick="setTheme('theme-color-2', this)">🤍 화이트</button>
                    <button class="btn-opt" onclick="setTheme('theme-color-3', this)">🥐 베이지</button>
                    <button class="btn-opt" onclick="setTheme('theme-grad-1', this)">☁️ 파스텔</button>
                    <button class="btn-opt" onclick="setTheme('theme-grad-2', this)">🌸 피치</button>
                    <button class="btn-opt" onclick="setTheme('theme-grad-3', this)">🔮 보라</button>
                    <button class="btn-opt" onclick="setTheme('theme-pat-1', this)">🏁 체커</button>
                    <button class="btn-opt" onclick="setTheme('theme-pat-2', this)">🟡 옐로우닷</button>
                    <button class="btn-opt" onclick="setTheme('theme-pat-3', this)">💈 캔디</button>
                </div>
            </div>

            <!-- 3. 스티커 정렬 배치 -->
            <div class="control-group">
                <div class="control-label">3. 스티커 자동 추가</div>
                <div class="grid-3">
                    <button class="btn-opt" onclick="addSticker('❤️')">❤️ 하트</button>
                    <button class="btn-opt" onclick="addSticker('🎓')">🎓 학사모</button>
                    <button class="btn-opt" onclick="addSticker('✨')">✨ 반짝이</button>
                    <button class="btn-opt" onclick="addSticker('🏫')">🏫 학교</button>
                    <button class="btn-opt" onclick="addSticker('🎀')">🎀 리본</button>
                    <button class="btn-opt" onclick="addSticker('🍀')">🍀 행운</button>
                </div>
                <button class="btn-opt" style="margin-top: 4px; color: var(--accent-color);" onclick="clearStickers()">🔄 스티커 초기화</button>
            </div>

            <!-- 4. 상단 문구 수정 -->
            <div class="control-group">
                <div class="control-label">4. 상단 문구 입력</div>
                <input type="text" class="input-text" id="input-header-text" value="오늘의 추억 ✨" oninput="updateHeaderText()">
            </div>
        </div>
    </div>

    <!-- 결과 안내 및 QR 코드 다운로드 모달 -->
    <div class="modal-mask" id="result-modal">
        <div class="modal-card">
            <h3>촬영이 완료되었습니다! 🎉</h3>
            <p style="font-size: 0.85rem; color: var(--text-sub);">스마트폰 카메라로 아래 QR코드를 스캔하시면 사진을 바로 다운로드할 수 있습니다.</p>
            
            <!-- QR 코드 노출 위치 -->
            <div class="qr-wrapper" id="qrcode-box"></div>

            <!-- 결과 이미지 미리보기 -->
            <div class="preview-img-box">
                <img id="final-result-img" alt="최종 사진 미리보기">
            </div>

            <button class="btn-primary" style="width: 100%; padding: 12px;" onclick="closeModal()">다시 찍기 🔄</button>
        </div>
    </div>

    <!-- 캡처 합성용 비가시 Canvas -->
    <canvas id="render-canvas" style="display:none;"></canvas>

    <script>
        let videoStream = null;
        let currentCutCount = 4;
        let activeThemeClass = 'theme-color-1';

        const cameraGrid = document.getElementById('camera-grid');
        const frameOuter = document.getElementById('frame-outer');
        const stickerLayer = document.getElementById('sticker-layer');
        const textHeaderDisplay = document.getElementById('text-header-display');
        const countdownEl = document.getElementById('countdown');

        // 1. 카메라 시작 및 스트림 연결
        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: 'user' },
                    audio: false
                });
                renderCutBoxes();
            } catch (err) {
                alert('카메라 권한을 허용해주세요.');
            }
        }

        // 2. 컷수에 맞게 비디오 엘리먼트 생성 및 배치
        function renderCutBoxes() {
            cameraGrid.innerHTML = '';
            cameraGrid.className = `camera-grid cut-${currentCutCount}`;

            for (let i = 0; i < currentCutCount; i++) {
                const box = document.createElement('div');
                box.className = 'cut-box';

                const video = document.createElement('video');
                video.className = 'webcam-stream';
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                video.srcObject = videoStream;

                box.appendChild(video);
                cameraGrid.appendChild(box);
            }
        }

        // 3. 컷수 변경 클릭
        function setCutLayout(cutNum, btn) {
            currentCutCount = cutNum;
            document.querySelectorAll('.sidebar-section .control-group:nth-child(2) .btn-opt').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderCutBoxes();
        }

        // 4. 배경 테마 변경
        function setTheme(themeClass, btn) {
            frameOuter.classList.remove(activeThemeClass);
            activeThemeClass = themeClass;
            frameOuter.classList.add(activeThemeClass);

            document.querySelectorAll('.sidebar-section .control-group:nth-child(3) .btn-opt').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
        }

        // 5. 스티커 자동/스마트 모서리 배치
        function addSticker(emoji) {
            const sticker = document.createElement('div');
            sticker.className = 'sticker-item';
            sticker.innerText = emoji;

            // 얼굴 촬영 영역을 가리지 않도록 프레임의 외각 모서리 위주 배치
            const positions = [
                { top: '8%', left: '10%' },
                { top: '8%', left: '90%' },
                { top: '92%', left: '12%' },
                { top: '92%', left: '88%' },
                { top: '50%', left: '6%' },
                { top: '50%', left: '94%' }
            ];

            const count = stickerLayer.children.length;
            const pos = positions[count % positions.length];

            sticker.style.top = pos.top;
            sticker.style.left = pos.left;

            stickerLayer.appendChild(sticker);
        }

        function clearStickers() {
            stickerLayer.innerHTML = '';
        }

        // 6. 상단 문구 업데이트
        function updateHeaderText() {
            const txt = document.getElementById('input-header-text').value;
            textHeaderDisplay.innerText = txt;
        }

        // 7. 사진 촬영 및 합성 프로세스
        document.getElementById('btn-take-photo').addEventListener('click', () => {
            let count = 3;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    captureFrame();
                }
            }, 1000);
        });

        // 8. 캔버스 프레임 최종 합성 및 다운로드 QR 생성
        function captureFrame() {
            const canvas = document.getElementById('render-canvas');
            const ctx = canvas.getContext('2d');

            const width = 800;
            const height = 1100;
            canvas.width = width;
            canvas.height = height;

            // A. 테마 배경 칠하기
            if (activeThemeClass === 'theme-color-1') ctx.fillStyle = '#1a1a1a';
            else if (activeThemeClass === 'theme-color-2') ctx.fillStyle = '#ffffff';
            else if (activeThemeClass === 'theme-color-3') ctx.fillStyle = '#f4ebe1';
            else if (activeThemeClass.startsWith('theme-grad')) {
                let grad = ctx.createLinearGradient(0, 0, width, height);
                if (activeThemeClass === 'theme-grad-1') { grad.addColorStop(0, '#a1c4fd'); grad.addColorStop(1, '#c2e9fb'); }
                else if (activeThemeClass === 'theme-grad-2') { grad.addColorStop(0, '#ff9a9e'); grad.addColorStop(1, '#fecfef'); }
                else { grad.addColorStop(0, '#667eea'); grad.addColorStop(1, '#764ba2'); }
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = '#ffe5ec';
            }
            ctx.fillRect(0, 0, width, height);

            // B. 상단 문구 draw
            ctx.fillStyle = (activeThemeClass === 'theme-color-2' || activeThemeClass === 'theme-color-3') ? '#1a1a1a' : '#ffffff';
            ctx.font = 'bold 36px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(textHeaderDisplay.innerText, width / 2, 70);

            // C. 컷수별 비디오 캡처 합성
            const videos = document.querySelectorAll('.webcam-stream');
            const padding = 30;
            const topMargin = 100;
            const bottomMargin = 80;
            const gridWidth = width - (padding * 2);
            const gridHeight = height - topMargin - bottomMargin;

            if (currentCutCount === 1) {
                drawVideoToCanvas(ctx, videos[0], padding, topMargin, gridWidth, gridHeight);
            } else if (currentCutCount === 2) {
                const h = (gridHeight - padding) / 2;
                drawVideoToCanvas(ctx, videos[0], padding, topMargin, gridWidth, h);
                drawVideoToCanvas(ctx, videos[1], padding, topMargin + h + padding, gridWidth, h);
            } else if (currentCutCount === 3) {
                const h = (gridHeight - (padding * 2)) / 3;
                for (let i = 0; i < 3; i++) {
                    drawVideoToCanvas(ctx, videos[i], padding, topMargin + (i * (h + padding)), gridWidth, h);
                }
            } else if (currentCutCount === 4) {
                const w = (gridWidth - padding) / 2;
                const h = (gridHeight - padding) / 2;
                drawVideoToCanvas(ctx, videos[0], padding, topMargin, w, h);
                drawVideoToCanvas(ctx, videos[1], padding + w + padding, topMargin, w, h);
                drawVideoToCanvas(ctx, videos[2], padding, topMargin + h + padding, w, h);
                drawVideoToCanvas(ctx, videos[3], padding + w + padding, topMargin + h + padding, w, h);
            }

            // D. 하단 서명 문구
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('Seonbu', padding, height - 30);
            ctx.textAlign = 'right';
            ctx.fillText('선부포토 📸', width - padding, height - 30);

            // E. 스티커 그려주기
            const stickers = document.querySelectorAll('.sticker-item');
            const outerRect = frameOuter.getBoundingClientRect();

            stickers.forEach(s => {
                const rect = s.getBoundingClientRect();
                const rx = (rect.left - outerRect.left) / outerRect.width;
                const ry = (rect.top - outerRect.top) / outerRect.height;

                ctx.font = '48px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(s.innerText, rx * width, ry * height);
            });

            // F. 이미지 변환 및 모바일 다이렉트 다운로드 QR 생성
            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('final-result-img').src = dataUrl;

            // 모바일에서 스캔 시 이미지가 바로 열리도록 Data URI 기반 QR코드 생성
            const qrBox = document.getElementById('qrcode-box');
            qrBox.innerHTML = '';
            new QRCode(qrBox, {
                text: dataUrl,
                width: 160,
                height: 160,
                correctLevel: QRCode.CorrectLevel.L
            });

            document.getElementById('result-modal').style.display = 'flex';
        }

        // 비디오 프레임 좌우 반전 Crop Draw
        function drawVideoToCanvas(ctx, videoEl, x, y, w, h) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 12);
            ctx.clip();

            // 반전 처리
            ctx.translate(x + w, y);
            ctx.scale(-1, 1);
            ctx.drawImage(videoEl, 0, 0, w, h);
            ctx.restore();
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        // 웹캠 시작
        startCamera();
    </script>
</body>
</html>
