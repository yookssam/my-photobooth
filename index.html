<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>선부포토 - my-photobooth</title>
    <!-- QR 코드 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- 웹 폰트 불러오기 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Batang:wght@700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1117;
            --panel-bg: #1a1d26;
            --card-bg: #262a36;
            --accent-color: #ff4757;
            --accent-hover: #ff6b81;
            --text-color: #ffffff;
            --text-sub: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 16px;
            gap: 20px;
        }

        .stage-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 뷰파인더 메인 프레임 */
        .viewfinder-outer {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: calc(100vh - 120px);
            max-height: 620px;
            background-color: #1a1a1a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            padding: 40px 20px 24px 20px;
            transition: all 0.3s ease;
        }

        /* 배경 이미지(상/하단 글씨)를 사진 레이어 무조건 '위'에 배치 */
        .viewfinder-outer::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            pointer-events: none;
            z-index: 10; /* 카메라 화면(z-index: 1)보다 더 앞으로 레이어 배치 */
        }

        /* 배경 테마 적용 */
        .viewfinder-outer.theme-school::after { background-image: url('bg-school2.png'); }
        .viewfinder-outer.theme-color-1 { background: #1a1a1a; }
        .viewfinder-outer.theme-color-2 { background: #ffffff; color: #1a1a1a; }
        .viewfinder-outer.theme-color-3 { background: #f4ebe1; color: #333333; }
        .viewfinder-outer.theme-grad-1 { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .viewfinder-outer.theme-grad-2 { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }

        /* 사용자 입력 우측 상단 문구 위치 */
        .frame-header {
            position: absolute;
            top: 12px;
            right: 20px;
            font-size: 1rem;
            font-weight: 700;
            z-index: 15; /* 가장 최상단 */
            white-space: nowrap;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* 카메라 화면 그리드 레이어 (배경보다 아래로 배치) */
        .camera-grid {
            flex: 1;
            display: grid;
            gap: 8px;
            width: 100%;
            position: relative;
            z-index: 1; /* 낮은 z-index로 하단 글씨가 사진을 덮게 함 */
            overflow: hidden;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .camera-grid.cut-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
        .camera-grid.cut-2 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
        .camera-grid.cut-3 { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr 1fr; }
        .camera-grid.cut-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }

        .cut-box {
            position: relative;
            background-color: #000;
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 6px;
        }

        .webcam-stream {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            display: block;
        }

        .sticker-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 20;
        }

        .sticker-item {
            position: absolute;
            font-size: 2rem;
            transform: translate(-50%, -50%);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .countdown-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 6rem;
            font-weight: 900;
            color: var(--accent-color);
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 30;
            display: none;
        }

        .action-bar {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            z-index: 20;
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 14px 36px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 71, 87, 0.4);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        .sidebar-section {
            width: 380px;
            background-color: var(--panel-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            overflow-y: auto;
            max-height: 100vh;
        }

        .sidebar-title {
            font-size: 1.2rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-sub);
        }

        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }

        .btn-opt {
            background-color: var(--card-bg);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.05);
            padding: 8px 6px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-opt:hover { background-color: #323746; }
        
        .btn-opt.active {
            background-color: var(--accent-color) !important;
            border-color: var(--accent-color) !important;
            color: #ffffff !important;
        }

        .color-btn {
            height: 32px;
            border-radius: 8px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-btn:hover { transform: scale(1.05); }
        .color-btn.active { border-color: #ffffff !important; transform: scale(1.1); }

        .input-text {
            width: 100%;
            background-color: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 12px;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .modal-mask {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-card {
            background-color: var(--panel-bg);
            border-radius: 24px;
            padding: 24px;
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .qr-wrapper {
            background: #ffffff;
            padding: 12px;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-img-box {
            width: 100%;
            max-height: 220px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .preview-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-download {
            background-color: #2ed573;
            color: white;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
                height: auto;
                padding: 12px;
            }
            .sidebar-section { width: 100%; max-height: none; }
            .viewfinder-outer { height: 520px; max-height: 70vh; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 메인 촬영 뷰파인더 -->
        <div class="stage-section">
            <div class="viewfinder-outer theme-school" id="frame-outer">
                <!-- 우측 상단 문구 -->
                <div class="frame-header" id="text-header-display">오늘의 추억 ✨</div>

                <div class="camera-grid cut-4" id="camera-grid">
                    <!-- 비디오 박스 동적 생성 영역 -->
                </div>

                <div class="sticker-layer" id="sticker-layer"></div>
                <div class="countdown-overlay" id="countdown">3</div>
            </div>

            <div class="action-bar">
                <button class="btn-primary" id="btn-take-photo">사진 촬영 📸</button>
            </div>
        </div>

        <!-- 설정 사이드바 -->
        <div class="sidebar-section">
            <div class="sidebar-title">📸 선부포토 설정</div>

            <!-- 1. 컷수 선택 -->
            <div class="control-group" id="grp-cut">
                <div class="control-label">1. 프레임 컷수 선택</div>
                <div class="grid-4">
                    <button class="btn-opt" onclick="setCutLayout(1, this)">1컷</button>
                    <button class="btn-opt" onclick="setCutLayout(2, this)">2컷</button>
                    <button class="btn-opt" onclick="setCutLayout(3, this)">3컷</button>
                    <button class="btn-opt active" onclick="setCutLayout(4, this)">4컷</button>
                </div>
            </div>

            <!-- 2. 상단 문구 선택 및 직접 입력 -->
            <div class="control-group" id="grp-preset">
                <div class="control-label">2. 상단 문구 선택 & 직접 입력</div>
                <div class="grid-2">
                    <button class="btn-opt active" onclick="selectPresetText('오늘의 추억 ✨', this)">오늘의 추억 ✨</button>
                    <button class="btn-opt" onclick="selectPresetText('우리들의 순간 💖', this)">우리들의 순간 💖</button>
                    <button class="btn-opt" onclick="selectPresetText('선부고의 하루 🏫', this)">선부고의 하루 🏫</button>
                    <button class="btn-opt" onclick="selectPresetText('우정 영원히 🍀', this)">우정 영원히 🍀</button>
                    <button class="btn-opt" onclick="selectPresetText('Happy Everyday 🎈', this)">Happy Everyday 🎈</button>
                    <button class="btn-opt" onclick="selectPresetText('빛나는 청춘 🌟', this)">빛나는 청춘 🌟</button>
                    <button class="btn-opt" onclick="selectPresetText('기억해 이 순간 📸', this)">기억해 이 순간 📸</button>
                    <button class="btn-opt" onclick="selectPresetText('함께라서 좋아 💛', this)">함께라서 좋아 💛</button>
                    <button class="btn-opt" onclick="selectPresetText('오늘도 화이팅 🔥', this)">오늘도 화이팅 🔥</button>
                    <button class="btn-opt" onclick="selectPresetText('Best Friends 💖', this)">Best Friends 💖</button>
                </div>
                <input type="text" class="input-text" id="input-header-text" value="오늘의 추억 ✨" placeholder="원하는 문구를 직접 입력해보세요" oninput="updateHeaderText()">
            </div>

            <!-- 3. 글씨 폰트 선택 -->
            <div class="control-group" id="grp-font">
                <div class="control-label">3. 글씨 폰트 선택</div>
                <div class="grid-4">
                    <button class="btn-opt active" style="font-family: 'Pretendard';" onclick="setFont('Pretendard', this)">기본 고딕</button>
                    <button class="btn-opt" style="font-family: 'Gaegu';" onclick="setFont('Gaegu', this)">둥근 귀여움</button>
                    <button class="btn-opt" style="font-family: 'Nanum Pen Script';" onclick="setFont('Nanum Pen Script', this)">감성 손글씨</button>
                    <button class="btn-opt" style="font-family: 'Gowun Batang';" onclick="setFont('Gowun Batang', this)">클래식 명조</button>
                </div>
            </div>

            <!-- 4. 글씨 색상 선택 -->
            <div class="control-group" id="grp-color">
                <div class="control-label">4. 글씨 색상 선택</div>
                <div class="grid-5">
                    <button class="color-btn active" style="background-color: #ffffff;" onclick="setTextColor('#ffffff', this)"></button>
                    <button class="color-btn" style="background-color: #ff4757;" onclick="setTextColor('#ff4757', this)"></button>
                    <button class="color-btn" style="background-color: #ffa502;" onclick="setTextColor('#ffa502', this)"></button>
                    <button class="color-btn" style="background-color: #2ed573;" onclick="setTextColor('#2ed573', this)"></button>
                    <button class="color-btn" style="background-color: #1e90ff;" onclick="setTextColor('#1e90ff', this)"></button>
                </div>
            </div>

            <!-- 5. 배경 테마 선택 -->
            <div class="control-group" id="grp-theme">
                <div class="control-label">5. 배경 테마 선택</div>
                <div class="grid-3">
                    <button class="btn-opt active" onclick="setTheme('theme-school', this)">🏫 선부고</button>
                    <button class="btn-opt" onclick="setTheme('theme-color-1', this)">🖤 블랙</button>
                    <button class="btn-opt" onclick="setTheme('theme-color-2', this)">🤍 화이트</button>
                    <button class="btn-opt" onclick="setTheme('theme-color-3', this)">🥐 베이지</button>
                    <button class="btn-opt" onclick="setTheme('theme-grad-1', this)">☁️ 파스텔</button>
                    <button class="btn-opt" onclick="setTheme('theme-grad-2', this)">🌸 피치</button>
                </div>
            </div>

            <!-- 6. 스티커 추가 -->
            <div class="control-group" id="grp-sticker">
                <div class="control-label">6. 스티커 추가</div>
                <div class="grid-3">
                    <button class="btn-opt" onclick="addSticker('❤️')">❤️ 하트</button>
                    <button class="btn-opt" onclick="addSticker('🎓')">🎓 학사모</button>
                    <button class="btn-opt" onclick="addSticker('✨')">✨ 반짝이</button>
                    <button class="btn-opt" onclick="addSticker('🏫')">🏫 학교</button>
                    <button class="btn-opt" onclick="addSticker('🎀')">🎀 리본</button>
                    <button class="btn-opt" onclick="addSticker('🍀')">🍀 행운</button>
                </div>
                <button class="btn-opt" style="margin-top: 4px; color: var(--accent-color);" onclick="clearStickers()">🔄 스티커 초기화</button>
            </div>
        </div>
    </div>

    <!-- 최종 촬영 결과 모달 -->
    <div class="modal-mask" id="result-modal">
        <div class="modal-card">
            <h3>촬영이 완료되었습니다! 🎉</h3>
            
            <div class="preview-img-box">
                <img id="final-result-img" alt="최종 사진 미리보기">
            </div>

            <button class="btn-download" onclick="downloadPhoto()">💾 기기에 사진 저장하기</button>

            <p style="font-size: 0.8rem; color: var(--text-sub); margin-top: 5px;">QR 스캔하여 포토부스 접속하기</p>
            <div class="qr-wrapper" id="qrcode-box"></div>

            <button class="btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="closeModal()">다시 찍기 🔄</button>
        </div>
    </div>

    <canvas id="render-canvas" style="display:none;"></canvas>

    <script>
        let videoStream = null;
        let currentCutCount = 4;
        let activeThemeClass = 'theme-school';
        let currentFont = 'Pretendard';
        let currentTextColor = '#ffffff';
        
        // bg-school2.png 파일 로드
        const bgCustomImg = new Image();
        bgCustomImg.src = 'bg-school2.png';

        const cameraGrid = document.getElementById('camera-grid');
        const frameOuter = document.getElementById('frame-outer');
        const stickerLayer = document.getElementById('sticker-layer');
        const textHeaderDisplay = document.getElementById('text-header-display');
        const inputHeaderText = document.getElementById('input-header-text');
        const countdownEl = document.getElementById('countdown');

        async function startCamera() {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: 'user' },
                    audio: false
                });
                renderCutBoxes();
            } catch (err) {
                alert('카메라 사용 권한이 필요합니다.');
            }
        }

        function renderCutBoxes() {
            cameraGrid.innerHTML = '';
            cameraGrid.className = `camera-grid cut-${currentCutCount}`;

            for (let i = 0; i < currentCutCount; i++) {
                const box = document.createElement('div');
                box.className = 'cut-box';

                const video = document.createElement('video');
                video.className = 'webcam-stream';
                video.autoplay = true;
                video.playsInline = true;
                video.muted = true;
                video.srcObject = videoStream;

                box.appendChild(video);
                cameraGrid.appendChild(box);
            }
        }

        function setActiveButton(groupId, targetBtn) {
            const group = document.getElementById(groupId);
            if (!group) return;
            group.querySelectorAll('.btn-opt, .color-btn').forEach(btn => btn.classList.remove('active'));
            if (targetBtn) targetBtn.classList.add('active');
        }

        function setCutLayout(cutNum, btn) {
            currentCutCount = cutNum;
            setActiveButton('grp-cut', btn);
            renderCutBoxes();
        }

        function selectPresetText(text, btn) {
            inputHeaderText.value = text;
            textHeaderDisplay.innerText = text;
            setActiveButton('grp-preset', btn);
        }

        function updateHeaderText() {
            textHeaderDisplay.innerText = inputHeaderText.value;
            const group = document.getElementById('grp-preset');
            group.querySelectorAll('.btn-opt').forEach(btn => btn.classList.remove('active'));
        }

        function setFont(fontName, btn) {
            currentFont = fontName;
            textHeaderDisplay.style.fontFamily = `'${fontName}', sans-serif`;
            setActiveButton('grp-font', btn);
        }

        function setTextColor(color, btn) {
            currentTextColor = color;
            textHeaderDisplay.style.color = color;
            setActiveButton('grp-color', btn);
        }

        function setTheme(themeClass, btn) {
            frameOuter.classList.remove(activeThemeClass);
            activeThemeClass = themeClass;
            frameOuter.classList.add(activeThemeClass);
            setActiveButton('grp-theme', btn);
        }

        function addSticker(emoji) {
            const sticker = document.createElement('div');
            sticker.className = 'sticker-item';
            sticker.innerText = emoji;

            const positions = [
                { top: '15%', left: '10%' },
                { top: '15%', left: '50%' },
                { top: '88%', left: '15%' },
                { top: '88%', left: '85%' }
            ];

            const count = stickerLayer.children.length;
            const pos = positions[count % positions.length];

            sticker.style.top = pos.top;
            sticker.style.left = pos.left;

            stickerLayer.appendChild(sticker);
        }

        function clearStickers() {
            stickerLayer.innerHTML = '';
        }

        document.getElementById('btn-take-photo').addEventListener('click', () => {
            let count = 3;
            countdownEl.style.display = 'block';
            countdownEl.innerText = count;

            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownEl.innerText = count;
                } else {
                    clearInterval(timer);
                    countdownEl.style.display = 'none';
                    captureFrame();
                }
            }, 1000);
        });

        /* 캡처 합성 함수: 배경 레이어가 사진 레이어 위로 오도록 전면 수정 */
        function captureFrame() {
            const canvas = document.getElementById('render-canvas');
            const ctx = canvas.getContext('2d');

            const width = 800;
            const height = 1100;
            canvas.width = width;
            canvas.height = height;

            // 1. 단색/그라데이션 기본 바탕색 그리기
            if (activeThemeClass === 'theme-color-1') {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, width, height);
            } else if (activeThemeClass === 'theme-color-2') {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, width, height);
            } else if (activeThemeClass === 'theme-color-3') {
                ctx.fillStyle = '#f4ebe1'; ctx.fillRect(0, 0, width, height);
            } else if (activeThemeClass.startsWith('theme-grad')) {
                let grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, '#a1c4fd'); grad.addColorStop(1, '#c2e9fb');
                ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);
            } else {
                ctx.fillStyle = '#1a1a1a'; ctx.fillRect(0, 0, width, height);
            }

            // 2. 비디오 캡처 화면 먼저 그리기 (배경 오버레이보다 밑 레이어에 도배)
            const videos = document.querySelectorAll('.webcam-stream');
            const padding = 35;
            const topMargin = 80;
            const bottomMargin = 50;
            const gridWidth = width - (padding * 2);
            const gridHeight = height - topMargin - bottomMargin;

            if (currentCutCount === 1) {
                drawVideoToCanvas(ctx, videos[0], padding, topMargin, gridWidth, gridHeight);
            } else if (currentCutCount === 2) {
                const h = (gridHeight - padding) / 2;
                drawVideoToCanvas(ctx, videos[0], padding, topMargin, gridWidth, h);
                drawVideoToCanvas(ctx, videos[1], padding, topMargin + h + padding, gridWidth, h);
            } else if (currentCutCount === 3) {
                const h = (gridHeight - (padding * 2)) / 3;
                for (let i = 0; i < 3; i++) {
                    drawVideoToCanvas(ctx, videos[i], padding, topMargin + (i * (h + padding)), gridWidth, h);
                }
            } else if (currentCutCount === 4) {
                const w = (gridWidth - padding) / 2;
                const h = (gridHeight - padding) / 2;
                drawVideoToCanvas(ctx, videos[0], padding, topMargin, w, h);
                drawVideoToCanvas(ctx, videos[1], padding + w + padding, topMargin, w, h);
                drawVideoToCanvas(ctx, videos[2], padding, topMargin + h + padding, w, h);
                drawVideoToCanvas(ctx, videos[3], padding + w + padding, topMargin + h + padding, w, h);
            }

            // 3. 사진 레이어 '위'에 bg-school2.png 이미지 오버레이 (하단 글씨 등 잘리지 않게 표출)
            if (activeThemeClass === 'theme-school' && bgCustomImg.complete) {
                ctx.drawImage(bgCustomImg, 0, 0, width, height);
            }

            // 4. 우측 상단 문구 오버레이
            ctx.fillStyle = currentTextColor;
            ctx.font = `bold 32px '${currentFont}', sans-serif`;
            ctx.textAlign = 'right';
            ctx.fillText(textHeaderDisplay.innerText, width - 40, 50);

            // 5. 스티커 레이어 그려내기
            const stickers = document.querySelectorAll('.sticker-item');
            const outerRect = frameOuter.getBoundingClientRect();

            stickers.forEach(s => {
                const rect = s.getBoundingClientRect();
                const rx = (rect.left - outerRect.left) / outerRect.width;
                const ry = (rect.top - outerRect.top) / outerRect.height;

                ctx.font = '48px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(s.innerText, rx * width, ry * height);
            });

            // 6. 저장 및 QR생성 모달 출력
            const dataUrl = canvas.toDataURL('image/png');
            document.getElementById('final-result-img').src = dataUrl;

            const qrBox = document.getElementById('qrcode-box');
            qrBox.innerHTML = '';
            new QRCode(qrBox, {
                text: window.location.href,
                width: 130,
                height: 130
            });

            document.getElementById('result-modal').style.display = 'flex';
        }

        function drawVideoToCanvas(ctx, videoEl, x, y, w, h) {
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 12);
            ctx.clip();

            ctx.translate(x + w, y);
            ctx.scale(-1, 1);
            ctx.drawImage(videoEl, 0, 0, w, h);
            ctx.restore();
        }

        function downloadPhoto() {
            const canvas = document.getElementById('render-canvas');
            const a = document.createElement('a');
            a.href = canvas.toDataURL('image/png');
            a.download = `선부포토_${Date.now()}.png`;
            a.click();
        }

        function closeModal() {
            document.getElementById('result-modal').style.display = 'none';
        }

        startCamera();
    </script>
</body>
</html>
